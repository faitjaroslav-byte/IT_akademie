site_name: IT akademie
site_description: Webová učebnice a pracovní materiály pro IT akademii
site_author: Jaroslav Fait

theme:
  name: material
  language: cs
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Přepnout do tmavého režimu
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Přepnout do světlého režimu
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

nav:
  - IT akademie: index.md
  - Workspace Studio:
      - Přehled kurzu: workspace-studio/index.md
      - 1. Základy Workspace Studio: workspace-studio/01-zaklady.md
      - 2. Návrh flow: workspace-studio/02-navrh-flow.md
      - 3. Sumarizace e-mailů: workspace-studio/03-sumarizace-emailu.md
      - 4. AI štítky v Gmailu: workspace-studio/04-ai-stitky.md
      - 5. Vyhodnocení retrospektivy: workspace-studio/05-retrospektiva.md
      - 6. Ranní briefing: workspace-studio/06-ranni-briefing.md
      - 7. Testování a provoz: workspace-studio/07-testovani-a-provoz.md
      - 8. Workshop pro učitele: workspace-studio/08-workshop.md
      - Původní zdrojové scénáře: workspace-studio/scenare.md
