site_name: IT akademie
site_description: Webová učebnice a pracovní materiály pro IT akademii
site_author: Jaroslav Fait

theme:
  name: material
  language: cs
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Přepnout do tmavého režimu
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Přepnout do světlého režimu
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

exclude_docs: |
  workspace-studio/08-workshop.md
  workspace-studio/scenare.md

nav:
  - IT akademie: index.md
  - Workspace Studio:
      - Přehled kurzu: workspace-studio/index.md
      - 1. Základy Workspace Studio: workspace-studio/01-zaklady.md
      - 2. Návrh flow: workspace-studio/02-navrh-flow.md
      - 3. Sumarizace e-mailů: workspace-studio/03-sumarizace-emailu.md
      - 4. AI štítky v Gmailu: workspace-studio/04-ai-stitky.md
      - 5. Vyhodnocení retrospektivy: workspace-studio/05-retrospektiva.md
      - 6. Ranní briefing: workspace-studio/06-ranni-briefing.md
      - 7. Testování a provoz: workspace-studio/07-testovani-a-provoz.md
  - Data Studio:
      - Přehled kurzu: looker-studio/index.md
      - 0. Úvod do Data Studia: looker-studio/00-uvod-do-data-studia.md
      - 1. PISA a interpretace dat: looker-studio/01-pisa-a-interpretace.md
      - 2. Příprava dat: looker-studio/02-priprava-dat.md
      - 3. První report krok za krokem: looker-studio/03-prvni-report.md
      - 4. Srovnání zemí a oblastí: looker-studio/04-srovnani.md
      - 5. Mapa a interaktivní filtry: looker-studio/05-mapa-a-filtry.md
      - 6. Změny a rozložení výsledků: looker-studio/06-zmeny-a-rozlozeni.md
      - 7. Zaměření na střední školy: looker-studio/07-stredni-skoly.md
      - "Rozšíření: nejistota a mikrodata": looker-studio/09-nejistota-a-mikrodata.md
      - Data a datový slovník: looker-studio/data/README.md
